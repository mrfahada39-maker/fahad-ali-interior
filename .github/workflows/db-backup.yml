name: Automated Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger anytime from GitHub Actions tab

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Create Database Dump
        env:
          DB_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DIRECT_URL or DATABASE_URL secret is not set!"
            exit 1
          fi
          mkdir -p backups
          TIMESTAMP=$(date +"%Y-%m-%d_%H%M%S")
          BACKUP_FILE="backups/fahad_ali_interior_backup_${TIMESTAMP}.sql.gz"
          echo "Starting pg_dump..."
          pg_dump "$DB_URL" --no-owner --no-acl --clean --if-exists | gzip > "$BACKUP_FILE"
          
          # Verify backup was created and is non-empty
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "ERROR: Backup file was created but is empty!"
            exit 1
          fi
          
          FILE_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
          echo "Database backup created successfully: $BACKUP_FILE ($FILE_SIZE)"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
