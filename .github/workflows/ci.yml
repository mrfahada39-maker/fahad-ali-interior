name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies (Optional)
        run: if [ -d "Backend" ]; then npm ci --prefix Backend; fi

      - name: Generate Root Prisma Client
        run: npm run db:generate

      - name: Generate Backend Prisma Client (Optional)
        run: if [ -d "Backend" ]; then npm run prisma:generate --prefix Backend; fi

      - name: Lint Frontend
        run: npm run lint

      - name: Lint Backend (Optional)
        run: if [ -d "Backend" ]; then npm run lint --prefix Backend; fi

      - name: Typecheck Frontend
        run: npx tsc --noEmit

      - name: Typecheck Backend (Optional)
        run: if [ -d "Backend" ]; then npx tsc --noEmit --project Backend/tsconfig.json; fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies (Optional)
        run: if [ -d "Backend" ]; then npm ci --prefix Backend; fi

      - name: Generate Root Prisma Client
        run: npm run db:generate

      - name: Run Root Unit Tests
        run: npm run test:unit -- --passWithNoTests

      - name: Run Backend Unit Tests (Optional)
        run: if [ -d "Backend" ]; then npm run test --prefix Backend; fi

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit Root Dependencies
        run: npm audit --audit-level=high || true

      - name: Audit Backend Dependencies (Optional)
        run: if [ -d "Backend" ]; then npm audit --audit-level=high --prefix Backend || true; fi

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          if [ -d "Backend" ]; then npm ci --prefix Backend; fi

      - name: Generate Prisma Clients
        run: |
          npm run db:generate
          if [ -d "Backend" ]; then npm run prisma:generate --prefix Backend; fi

      - name: Build Backend (Optional)
        run: if [ -d "Backend" ]; then npm run build --prefix Backend; fi

      - name: Build Frontend
        env:
          NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: 'false'
          NEXT_PUBLIC_BACKEND_URL: 'https://api.yourdomain.com'
          SKIP_ENV_VALIDATION: 'true'
        run: npm run build
