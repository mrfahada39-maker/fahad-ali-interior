name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Generate Root Prisma Client
        run: npm run db:generate

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Generate Root Prisma Client
        run: npm run db:generate

      - name: Run Root Unit Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test_db' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-at-least-32-characters-long-key' }}
          INTERNAL_PROXY_KEY: ${{ secrets.INTERNAL_PROXY_KEY || 'test-proxy-key-123456789012345' }}
        run: npm run test:unit -- --passWithNoTests

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit Root Dependencies
        run: npm audit --audit-level=high || true

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Frontend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test_mock:test_mock@localhost:5432/test_db' }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL || 'postgresql://test_mock:test_mock@localhost:5432/test_db' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-at-least-32-characters-long-key' }}
          INTERNAL_PROXY_KEY: ${{ secrets.INTERNAL_PROXY_KEY || 'test-proxy-key-123456789012345' }}
          NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: 'false'
          NEXT_PUBLIC_BACKEND_URL: 'https://api.yourdomain.com'
          SKIP_ENV_VALIDATION: 'true'
        run: npm run build
