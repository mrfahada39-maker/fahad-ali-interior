name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    branches: [ main ]
    types:
      - completed

jobs:
  deploy-vercel-frontend:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Vercel Deploy Webhook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Vercel deployment triggered successfully."
          else
            echo "VERCEL_DEPLOY_HOOK_URL secret not set. Skipping webhook trigger (Vercel GitHub App auto-deploys main)."
          fi
