<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#DFB86C" />
      <stop offset="70%" stop-color="#C9A24D" />
      <stop offset="100%" stop-color="#8C6239" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241913" />
      <stop offset="50%" stop-color="#19110D" />
      <stop offset="100%" stop-color="#0E0A07" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Inner Gold Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Royal Crown Emblem -->
  <g transform="translate(156, 75) scale(8.5)" filter="url(#goldGlow)">
    <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.201a4 4 0 0 1-3.865 2.926H8.718a4 4 0 0 1-3.865-2.926L2.019 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="0.5" />
    <path d="M5 20.5h14" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Interlocking FA Luxury Monogram -->
  <text x="256" y="325" font-family="'Playfair Display', 'Cinzel', serif" font-size="145" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="4">
    FA
  </text>

  <!-- Diamond Divider -->
  <g transform="translate(256, 360)">
    <line x1="-120" y1="0" x2="-25" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="0,-8 8,0 0,8 -8,0" fill="url(#goldGrad)" />
    <line x1="25" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Brand Subtext -->
  <text x="256" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="8">
    FAHAD ALI
  </text>
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="12">
    INTERIOR
  </text>
</svg>
